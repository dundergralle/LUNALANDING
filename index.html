<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0008">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Luna</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --hot: #ff0080;
    --magenta: #cc0066;
    --deep: #660033;
    --dark: #0a0008;
    --darker: #050004;
    --mid: #1a0015;
    --text: #ff66bb;
    --dim: #993366;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100%;
    min-height: 100dvh;
    background: var(--darker);
    overflow-x: hidden;
  }

  /* === BACKGROUND === */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #2a0020 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 20% 80%, #1a0030 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 60%, #200010 0%, transparent 55%),
      var(--darker);
  }

  /* Scanlines overlay */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
  }

  /* Noise grain */
  .grain {
    position: fixed;
    inset: -50%;
    z-index: 3;
    pointer-events: none;
    width: 200%;
    height: 200%;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grain-shift 0.5s steps(1) infinite;
  }
  @keyframes grain-shift {
    0%  { transform: translate(0,0); }
    20% { transform: translate(-3%, -4%); }
    40% { transform: translate(3%, 2%); }
    60% { transform: translate(-2%, 5%); }
    80% { transform: translate(4%, -3%); }
    100%{ transform: translate(0,0); }
  }

  /* Glitch horizontal flicker */
  .glitch-lines {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    animation: glitch-flicker 8s infinite;
  }
  @keyframes glitch-flicker {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 1; background: linear-gradient(transparent 30%, rgba(255,0,128,0.06) 30%, rgba(255,0,128,0.06) 31%, transparent 31%, transparent 60%, rgba(255,0,128,0.04) 60%, rgba(255,0,128,0.04) 61%, transparent 61%); }
    94% { opacity: 0; }
    96% { opacity: 1; background: linear-gradient(transparent 50%, rgba(255,0,128,0.05) 50%, rgba(255,0,128,0.05) 52%, transparent 52%); }
    97% { opacity: 0; }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .p {
    position: absolute;
    border-radius: 50%;
    animation: float-up linear infinite;
    opacity: 0;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.2); }
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .star {
    position: absolute;
    color: var(--hot);
    font-size: 10px;
    animation: star-pulse ease-in-out infinite;
    opacity: 0.4;
  }
  @keyframes star-pulse {
    0%, 100% { opacity: 0.15; transform: scale(0.8) rotate(0deg); }
    50%       { opacity: 0.6; transform: scale(1.3) rotate(20deg); }
  }

  /* === CONTENT === */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2.5rem 1.5rem;
    padding-top: max(2.5rem, env(safe-area-inset-top));
    padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
  }

  /* === AVATAR === */
  .avatar-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin-bottom: 1.2rem;
  }

  /* Outer glow ring */
  .avatar-wrap::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(
      var(--hot), var(--magenta), #ff66cc, var(--hot), #990055, var(--hot)
    );
    animation: ring-spin 3s linear infinite;
    z-index: 0;
    filter: blur(1px);
  }

  @keyframes ring-spin { to { transform: rotate(360deg); } }

  .avatar-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--dark);
    box-shadow:
      0 0 20px rgba(255,0,128,0.7),
      0 0 50px rgba(255,0,128,0.3),
      inset 0 0 10px rgba(255,0,128,0.2);
    animation: avatar-glow 3s ease-in-out infinite;
  }

  @keyframes avatar-glow {
    0%, 100% { box-shadow: 0 0 20px rgba(255,0,128,0.6), 0 0 50px rgba(255,0,128,0.25); }
    50%       { box-shadow: 0 0 30px rgba(255,0,128,0.9), 0 0 70px rgba(255,0,128,0.45), 0 0 100px rgba(200,0,80,0.2); }
  }

  .avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.1) saturate(0.95);
  }

  /* === NAME === */
  .name-wrap {
    position: relative;
    margin-bottom: 0.2rem;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: 2.6rem;
    color: var(--hot);
    letter-spacing: 0.04em;
    text-shadow:
      0 0 8px rgba(255,0,128,1),
      0 0 20px rgba(255,0,128,0.7),
      0 0 40px rgba(255,0,128,0.4),
      2px 2px 0 rgba(0,0,0,0.8);
    animation: name-glow 2.5s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }

  @keyframes name-glow {
    0%, 100% { text-shadow: 0 0 8px rgba(255,0,128,0.9), 0 0 20px rgba(255,0,128,0.5), 0 0 40px rgba(255,0,128,0.3), 2px 2px 0 rgba(0,0,0,0.8); }
    50%       { text-shadow: 0 0 12px rgba(255,0,128,1), 0 0 30px rgba(255,0,128,0.8), 0 0 60px rgba(255,0,128,0.5), 0 0 80px rgba(200,0,80,0.3), 2px 2px 0 rgba(0,0,0,0.8); }
  }

  /* Glitch effect on name */
  h1::before,
  h1::after {
    content: 'Luna';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
  }
  h1::before {
    color: #00ffff;
    animation: glitch-a 5s infinite;
    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
    opacity: 0;
  }
  h1::after {
    color: #ff0040;
    animation: glitch-b 5s infinite;
    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
    opacity: 0;
  }
  @keyframes glitch-a {
    0%, 88%, 100% { opacity: 0; transform: translate(0); }
    90% { opacity: 0.7; transform: translate(-3px, 1px); }
    92% { opacity: 0; }
    94% { opacity: 0.5; transform: translate(2px, -1px); }
    96% { opacity: 0; }
  }
  @keyframes glitch-b {
    0%, 88%, 100% { opacity: 0; transform: translate(0); }
    91% { opacity: 0.6; transform: translate(3px, 0); }
    93% { opacity: 0; }
    95% { opacity: 0.4; transform: translate(-2px, 1px); }
    97% { opacity: 0; }
  }

  /* Decorative dashes under name */
  .name-deco {
    text-align: center;
    color: var(--magenta);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    margin-bottom: 0.6rem;
    opacity: 0.7;
    font-family: 'Special Elite', monospace;
  }

  /* Location */
  .location-text {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Special Elite', monospace;
    font-size: 0.72rem;
    color: var(--dim);
    margin-bottom: 1.4rem;
    letter-spacing: 0.08em;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hot);
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--hot), 0 0 12px var(--hot);
    animation: dot-pulse 2s infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--hot), 0 0 12px var(--hot); }
    50% { opacity: 0.4; box-shadow: 0 0 3px var(--hot); }
  }

  /* === BUTTONS === */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    width: 100%;
    max-width: 320px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 50px;
    padding: 0 1.2rem;
    border-radius: 4px;
    background: rgba(10, 0, 8, 0.85);
    color: var(--hot);
    font-family: 'Special Elite', monospace;
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    border: 1px solid var(--magenta);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: transform 0.12s ease, background 0.15s ease;
    box-shadow:
      0 0 8px rgba(255,0,128,0.3),
      inset 0 0 12px rgba(255,0,128,0.05);
    animation: btn-breathe 3.5s ease-in-out infinite;
  }

  .btn:nth-child(2) { animation-delay: 0.5s; }
  .btn:nth-child(3) { animation-delay: 1s; }

  @keyframes btn-breathe {
    0%, 100% { box-shadow: 0 0 8px rgba(255,0,128,0.3), inset 0 0 12px rgba(255,0,128,0.05); border-color: var(--magenta); }
    50% { box-shadow: 0 0 16px rgba(255,0,128,0.5), 0 0 30px rgba(255,0,128,0.2), inset 0 0 20px rgba(255,0,128,0.08); border-color: var(--hot); }
  }

  /* Scanline shimmer inside button */
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(255,0,128,0.03) 3px,
      rgba(255,0,128,0.03) 4px
    );
    pointer-events: none;
  }

  /* Hover sweep */
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,0,128,0.12), transparent);
    transition: left 0.4s ease;
    pointer-events: none;
  }

  @media (hover: hover) {
    .btn:hover {
      background: rgba(255,0,128,0.1);
      transform: translateY(-1px);
    }
    .btn:hover::after { left: 100%; }
  }

  .btn:active {
    background: rgba(255,0,128,0.15);
    transform: scale(0.98);
  }

  /* Corner decorations on first button */
  .btn-primary {
    border-color: var(--hot);
    color: #fff;
    text-shadow: 0 0 8px var(--hot), 0 0 16px var(--hot);
  }
  .btn-primary::before {
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(255,0,128,0.06) 3px,
      rgba(255,0,128,0.06) 4px
    );
  }

  /* Bottom decoration */
  .bottom-deco {
    margin-top: 1.5rem;
    font-family: 'Special Elite', monospace;
    font-size: 0.65rem;
    color: var(--deep);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.5;
  }
</style>
</head>
<body>

<script>
var path = window.location.pathname.replace(/\/$/, '');
if (path === '/link') {
  window.location.replace('https://t.me/lunasdarkside');
}
</script>

<div class="bg"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="glitch-lines"></div>

<!-- Stars -->
<div class="stars">
  <span class="star" style="left:8%;top:12%;animation-duration:3.1s;animation-delay:0s">✦</span>
  <span class="star" style="left:88%;top:8%;animation-duration:2.7s;animation-delay:0.5s">★</span>
  <span class="star" style="left:15%;top:82%;animation-duration:3.8s;animation-delay:1.2s">✧</span>
  <span class="star" style="left:78%;top:78%;animation-duration:2.4s;animation-delay:0.8s">✦</span>
  <span class="star" style="left:50%;top:5%;animation-duration:3.3s;animation-delay:1.5s">★</span>
  <span class="star" style="left:5%;top:45%;animation-duration:4s;animation-delay:0.3s">✧</span>
  <span class="star" style="left:93%;top:40%;animation-duration:2.9s;animation-delay:1.8s">✦</span>
  <span class="star" style="left:35%;top:90%;animation-duration:3.5s;animation-delay:0.7s">★</span>
  <span class="star" style="left:65%;top:92%;animation-duration:2.6s;animation-delay:2.1s">✧</span>
  <span class="star" style="left:22%;top:6%;animation-duration:3.2s;animation-delay:1.0s" style="font-size:7px">✦</span>
</div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<div class="content">

  <div class="avatar-wrap">
    <div class="avatar-inner">
      <img class="avatar" src="https://github.com/dundergralle/LUNALANDING/blob/main/photo_2026-05-19_18-37-51.jpg?raw=true" alt="Luna">
    </div>
  </div>

  <div class="name-wrap">
    <h1>Luna</h1>
  </div>

  <div class="name-deco">✦ · ✦ · ✦</div>

  <div class="location-text">
    <span class="dot"></span>
    <span id="loc-text"></span>
  </div>

  <div class="buttons">
    <a class="btn btn-primary" href="/link" target="_blank">⛧ hemliga sidan ⛧</a>
    <a class="btn" href="https://www.instagram.com/lunanordgren">instagram</a>
    <a class="btn" href="https://x.com/lunanordgren">twitter / x</a>
  </div>

  <div class="bottom-deco">run away · make friends with the moon</div>
</div>

<script>
// Particles
(function() {
  var container = document.getElementById('particles');
  var colors = ['#ff0080','#cc0066','#ff66bb','#990055','#ff3399'];
  for (var i = 0; i < 18; i++) {
    var p = document.createElement('div');
    p.className = 'p';
    var size = Math.random() * 3 + 1.5;
    p.style.cssText = [
      'left:' + (Math.random() * 100) + '%',
      'bottom:' + (Math.random() * -10) + 'px',
      'width:' + size + 'px',
      'height:' + size + 'px',
      'background:' + colors[Math.floor(Math.random() * colors.length)],
      'box-shadow: 0 0 ' + (size*3) + 'px ' + colors[Math.floor(Math.random() * colors.length)],
      'animation-duration:' + (Math.random() * 8 + 6) + 's',
      'animation-delay:' + (Math.random() * 8) + 's'
    ].join(';');
    container.appendChild(p);
  }
})();

// Geolocation
(function() {
  var fallbacks = [
    "Stockholm","Göteborg","Malmö","Uppsala","Linköping","Örebro","Västerås",
    "Helsingborg","Norrköping","Jönköping","Umeå","Lund","Gävle","Borås","Sundsvall",
    "Oslo","Bergen","Trondheim","Stavanger","Drammen","Kristiansand","Tromsø","Ålesund"
  ];
  function setCity(city) {
    var c = (city && city.trim().length > 1) ? city.trim() : fallbacks[Math.floor(Math.random() * fallbacks.length)];
    document.getElementById('loc-text').textContent = '5 minutes ago in: ' + c;
  }
  function get(url, extract) {
    return fetch(url, { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(d) {
      var v = extract(d);
      if (!v || v.trim().length < 2) throw new Error('no city');
      return v;
    });
  }
  get('https://ipinfo.io/json', function(d) { return d && d.city; })
    .catch(function() { return get('https://ip-api.com/json/?fields=city,regionName', function(d) { return d && (d.city || d.regionName); }); })
    .catch(function() { return get('https://ipapi.co/json/', function(d) { return d && (d.city || d.region); }); })
    .then(function(city) { setCity(city); })
    .catch(function() { setCity(null); });
})();
</script>
</body>
</html>
